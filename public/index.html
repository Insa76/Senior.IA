<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>NORA</title>
  <script src="https://unpkg.com/lucide@latest"></script>
  <link rel="manifest" href="/manifest.json">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
body {
  font-family: Arial, sans-serif;
  margin: 0;
  background: #f2f4f8;
  display: flex;
  flex-direction: column;
  height: 100vh;
}

/* HEADER */
header {
  background: #4a90e2;
  color: white;
  text-align: center;
  padding: 20px;
  font-size: 28px;
}

/* CHAT */
#chat {
  flex: 1;
  overflow-y: auto;
  padding: 15px;
}

/* MENSAJES */
.msg {
  margin: 12px 0;
  padding: 18px;
  border-radius: 16px;
  max-width: 90%;
  font-size: 20px;
  line-height: 1.5;
}

.user {
  background: #4a90e2;
  color: white;
  margin-left: auto;
}

.bot {
  background: #e0e0e0;
  color: black;
}

/* CONTROLES */
#controls {
  padding: 10px;
  background: white;
  display: flex;
  gap: 10px;
}

/* INPUT GRANDE */
input {
  flex: 1;
  padding: 18px;
  font-size: 20px;
  border-radius: 12px;
  border: 1px solid #ccc;
}

/* BOTONES GRANDES */
button {
  padding: 18px;
  font-size: 20px;
  border: none;
  border-radius: 12px;
  cursor: pointer;
}

/* BOTÓN ENVIAR */
#sendBtn {
  background: #4a90e2;
  color: white;
}

/* BOTÓN VOZ */
#voiceBtn {
  background: #6c757d;
  color: white;
}

/* BOTÓN EMERGENCIA */
#emergencyBtn {
  background: red;
  color: white;
  width: 100%;
  margin: 10px 0;
  font-size: 22px;
}

/* MÓVIL */
@media (max-width: 600px) {

  header {
    font-size: 24px;
    padding: 15px;
  }

  .msg {
    font-size: 22px;
  }

  input {
    font-size: 22px;
  }

  button {
    font-size: 22px;
  }

}
</style>
</head>

<body>

<header>
  NORA 💙
</header>

<button onclick="toggleSimpleMode()" style="
  width:100%;
  padding:10px;
  font-size:16px;
  background:#333;
  color:white;
">
  Modo simple
</button>

<div id="simpleMode" style="display:none; padding:20px;">

  <button onclick="startVoice()" style="
    width:100%;
    padding:25px;
    font-size:24px;
    margin-bottom:15px;
  ">
    <i data-lucide="mic"></i> Hablar
  </button>

  <button onclick="feelingBad()" style="
    width:100%;
    padding:25px;
    font-size:24px;
    margin-bottom:15px;
    background:#ff9800;
    color:white;
  ">
    😔 No me siento bien
  </button>

  <button onclick="emergency()" style="
    width:100%;
    padding:25px;
    font-size:26px;
    background:red;
    color:white;
  ">
    <i data-lucide="alert-triangle"></i> Necesito ayuda
  </button>

</div>

<div id="normalMode">

<button id="emergencyBtn" onclick="emergency()">
  <i data-lucide="alert-triangle"></i> Necesito ayuda
</button>

<button id="badBtn" onclick="feelingBad()" style="
  background:#ff9800;
  color:white;
  width:100%;
  margin-bottom:10px;
  font-size:20px;
">
  😔 No me siento bien
</button>

<div style="display:flex;gap:8px;flex-wrap:wrap;padding:8px;">
<button id="soundBtn" onclick="toggleSound()">🔊 Sonido ON</button>
<button id="pushBtn" onclick="enableNotifications()">🔔 Activar avisos</button>
</div>

<div id="chat"></div>

<div id="controls">
  <input id="text" placeholder="Escribí o decí algo..." />
  <button id="sendBtn" onclick="send()">
  <i data-lucide="send"></i>
</button>
  <button onclick="startVoice()">
  <i data-lucide="mic"></i>
</button>
</div>
</div>


<script>
"use strict";

const params = new URLSearchParams(window.location.search);
const currentUserId = params.get("userId") || localStorage.getItem("userId");

if (!currentUserId) {
  window.location.replace("/login.html");
} else {
  localStorage.setItem("userId", currentUserId);
}

let soundEnabled = localStorage.getItem("sound") !== "off";
let simpleMode = false;
let serviceWorkerRegistration = null;
let busy = false;

function getUserId() {
  return currentUserId || "default-user";
}

function addMessage(text, type = "bot") {
  const chat = document.getElementById("chat");
  if (!chat) return;
  const div = document.createElement("div");
  div.className = "msg " + type;
  div.textContent = String(text ?? "");
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
}

function speak(text) {
  if (!soundEnabled || !("speechSynthesis" in window)) return;
  window.speechSynthesis.cancel();

  const cleaned = String(text || "").replace(/\([^)]*\)/g, "").trim();
  if (!cleaned) return;

  const utterance = new SpeechSynthesisUtterance(cleaned);
  const voices = window.speechSynthesis.getVoices();
  const voice = voices.find(v => v.lang?.toLowerCase().startsWith("es-ar")) ||
    voices.find(v => v.lang?.toLowerCase().startsWith("es"));
  utterance.lang = voice?.lang || "es-AR";
  utterance.rate = 0.92;
  utterance.pitch = 1;
  utterance.volume = 1;
  if (voice) utterance.voice = voice;
  window.speechSynthesis.speak(utterance);
}

function toggleSound() {
  soundEnabled = !soundEnabled;
  localStorage.setItem("sound", soundEnabled ? "on" : "off");
  document.getElementById("soundBtn").textContent = soundEnabled ? "🔊 Sonido ON" : "🔇 Sonido OFF";
  if (!soundEnabled && "speechSynthesis" in window) window.speechSynthesis.cancel();
}

function toggleSimpleMode() {
  simpleMode = !simpleMode;
  document.getElementById("simpleMode").style.display = simpleMode ? "block" : "none";
  document.getElementById("normalMode").style.display = simpleMode ? "none" : "block";
}

async function requestJson(url, options = {}) {
  const response = await fetch(url, options);
  let data = {};
  try { data = await response.json(); } catch (_) {}
  if (!response.ok) throw new Error(data.error || `Error HTTP ${response.status}`);
  return data;
}

async function send() {
  const input = document.getElementById("text");
  const message = input.value.trim();
  if (!message || busy) return;
  input.value = "";
  await sendMessage(message);
}

async function sendMessage(message) {
  if (busy) return;
  busy = true;
  addMessage(message, "user");
  const pending = document.createElement("div");
  pending.className = "msg bot";
  pending.textContent = "NORA está pensando…";
  document.getElementById("chat").appendChild(pending);

  try {
    const data = await requestJson("/chat", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ userId: getUserId(), message })
    });
    pending.remove();
    addMessage(data.reply || "No recibí una respuesta.", "bot");
    speak(data.reply);
  } catch (error) {
    pending.remove();
    addMessage(error.message || "No pude conectarme. Revisá la conexión e intentá nuevamente.", "bot");
  } finally {
    busy = false;
  }
}

async function emergency() {
  await sendMessage("Necesito ayuda. Es una emergencia.");
}

async function feelingBad() {
  await sendMessage("No me siento bien.");
}

function startVoice() {
  const Recognition = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!Recognition) {
    addMessage("Este navegador no permite reconocimiento de voz. Podés escribir tu mensaje.", "bot");
    return;
  }

  const recognition = new Recognition();
  recognition.lang = "es-AR";
  recognition.interimResults = false;
  recognition.maxAlternatives = 1;
  recognition.onresult = event => {
    const transcript = event.results?.[0]?.[0]?.transcript;
    if (transcript) sendMessage(transcript);
  };
  recognition.onerror = event => {
    addMessage(event.error === "not-allowed"
      ? "No tengo permiso para usar el micrófono. Revisá los permisos del navegador."
      : "No pude escucharte. Probá nuevamente o escribí tu mensaje.", "bot");
  };
  try { recognition.start(); } catch (_) {
    addMessage("No pude iniciar el micrófono. Probá nuevamente.", "bot");
  }
}

async function enableNotifications() {
  if (!("serviceWorker" in navigator) || !("PushManager" in window)) {
    addMessage("Este navegador no admite notificaciones push.", "bot");
    return;
  }
  if (!("Notification" in window)) {
    addMessage("Este navegador no admite notificaciones.", "bot");
    return;
  }

  try {
    const permission = await Notification.requestPermission();
    if (permission !== "granted") {
      addMessage("No se habilitaron las notificaciones. Podés activarlas desde los permisos del navegador.", "bot");
      return;
    }

    const keyData = await requestJson("/push/public-key");
    const registration = serviceWorkerRegistration || await navigator.serviceWorker.register("/sw.js");
    serviceWorkerRegistration = registration;
    let subscription = await registration.pushManager.getSubscription();
    if (!subscription) {
      subscription = await registration.pushManager.subscribe({
        userVisibleOnly: true,
        applicationServerKey: urlBase64ToUint8Array(keyData.publicKey)
      });
    }

    await requestJson(`/subscribe/${encodeURIComponent(getUserId())}`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(subscription)
    });
    addMessage("Listo. Este dispositivo quedó registrado para recibir avisos.", "bot");
  } catch (error) {
    addMessage(`No pude activar los avisos: ${error.message}`, "bot");
  }
}

function urlBase64ToUint8Array(base64String) {
  const padding = "=".repeat((4 - base64String.length % 4) % 4);
  const base64 = (base64String + padding).replace(/-/g, "+").replace(/_/g, "/");
  const raw = atob(base64);
  return Uint8Array.from([...raw].map(char => char.charCodeAt(0)));
}

async function pollUpdates() {
  try {
    const reminders = await requestJson(`/reminders/${encodeURIComponent(getUserId())}`);
    for (const item of (reminders.reminders || [])) {
      addMessage(`⏰ Recordatorio: ${item.text}`, "bot");
      if ("Notification" in window && Notification.permission === "granted") {
        try {
          if (serviceWorkerRegistration) {
            await serviceWorkerRegistration.showNotification("NORA", { body: item.text });
          } else {
            new Notification("NORA", { body: item.text });
          }
        } catch (_) {}
      }
      // Se confirma después de que la interfaz pudo presentar el aviso.
      await requestJson(`/reminders/${encodeURIComponent(getUserId())}/${encodeURIComponent(item.id)}/ack`, { method: "POST" });
    }
  } catch (_) {}

  try {
    const followUps = await requestJson(`/follow-up/${encodeURIComponent(getUserId())}`);
    (followUps.messages || []).forEach(message => {
      addMessage(message, "bot");
      speak(message);
    });
  } catch (_) {}
}

async function loadChat() {
  try {
    const data = await requestJson(`/chat-history/${encodeURIComponent(getUserId())}`);
    if (Array.isArray(data.chat) && data.chat.length) {
      data.chat.forEach(item => addMessage(item.text, item.role === "user" ? "user" : "bot"));
    } else {
      addMessage("¡Hola! Soy NORA. ¿Cómo estás hoy? Estoy acá para escucharte.", "bot");
    }
  } catch (error) {
    addMessage("No pude cargar el historial. Podés intentar conversar igualmente.", "bot");
  }
}

window.addEventListener("DOMContentLoaded", async () => {
  document.getElementById("soundBtn").textContent = soundEnabled ? "🔊 Sonido ON" : "🔇 Sonido OFF";
  document.getElementById("text").addEventListener("keydown", event => {
    if (event.key === "Enter") {
      event.preventDefault();
      send();
    }
  });

  if ("serviceWorker" in navigator) {
    try {
      serviceWorkerRegistration = await navigator.serviceWorker.register("/sw.js");
    } catch (error) {
      console.warn("No se pudo registrar el service worker:", error.message);
    }
  }

  await loadChat();
  pollUpdates();
  setInterval(pollUpdates, 15000);
  if (window.lucide?.createIcons) window.lucide.createIcons();
});
</script>

</body>
</html>
