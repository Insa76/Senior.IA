<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Panel Familiar</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      font-family: Arial;
      background: #f2f4f8;
      padding: 20px;
      margin: 0;
    }

    h1 {
      text-align: center;
    }

    .card {
      background: white;
      padding: 20px;
      margin: 15px 0;
      border-radius: 12px;
      font-size: 18px;
    }

    .status {
      text-align: center;
      padding: 20px;
      font-size: 24px;
      border-radius: 12px;
      color: white;
    }

    .normal { background: #4caf50; }
    .atencion { background: #ff9800; }
    .urgente { background: #f44336; }
  </style>
</head>

<body>

<h1>👨‍👩‍👧 Panel Familiar</h1>

<div id="statusBox" class="status">Cargando...</div>

<div class="card">
  <strong>Nombre:</strong> <span id="name"></span>
</div>

<div class="card">
  <strong>Estado emocional:</strong> <span id="emotion"></span>
</div>

<div class="card">
  <strong>Última interacción:</strong> <span id="time"></span>
</div>

<div class="card">
  <strong>Le gusta:</strong> <span id="likes"></span>
</div>

<div class="card">
  <strong>Historial reciente:</strong>
  <ul id="history"></ul>
</div>

<div class="card">
  <strong>Estado emocional (últimos registros):</strong>
  <canvas id="chart"></canvas>
</div>


<script>
let chart = null;
const userId = new URLSearchParams(window.location.search).get("userId");

function setStatus(status) {
  const box = document.getElementById("statusBox");
  const states = {
    normal: ["status normal", "🟢 Sin señales de alerta detectadas"],
    atencion: ["status atencion", "🟡 Requiere atención"],
    urgente: ["status urgente", "🔴 Atención prioritaria"]
  };
  const state = states[status] || states.normal;
  box.className = state[0];
  box.textContent = state[1];
}

async function loadData() {
  if (!userId) {
    document.getElementById("statusBox").textContent = "Falta el identificador del usuario en el enlace.";
    return;
  }

  try {
    const response = await fetch(`/family/${encodeURIComponent(userId)}`);
    if (!response.ok) throw new Error(`HTTP ${response.status}`);
    const data = await response.json();

    document.getElementById("name").textContent = data.name || "-";
    document.getElementById("emotion").textContent = data.emotion || "-";
    document.getElementById("time").textContent = data.lastInteraction && data.lastInteraction !== "sin datos"
      ? new Date(data.lastInteraction).toLocaleString("es-AR")
      : "Sin datos";
    document.getElementById("likes").textContent = (data.likes || []).join(", ") || "-";
    setStatus(data.status);

    const history = Array.isArray(data.history) ? data.history : [];
    const historyEl = document.getElementById("history");
    historyEl.replaceChildren();

    history.slice(-10).reverse().forEach(item => {
      const li = document.createElement("li");
      const time = item.time ? new Date(item.time).toLocaleString("es-AR") : "Fecha desconocida";
      li.textContent = `${item.emotion || "sin dato"} — ${time}`;
      historyEl.appendChild(li);
    });

    if (typeof Chart === "undefined") return;
    const labels = history.map(item => item.time ? new Date(item.time).toLocaleTimeString("es-AR") : "");
    const values = history.map(item => ({
      feliz: 4, neutral: 3, aburrido: 2, ansioso: 1, triste: 0
    }[item.emotion] ?? 2));

    if (!chart) {
      chart = new Chart(document.getElementById("chart"), {
        type: "line",
        data: {
          labels,
          datasets: [{
            label: "Registro emocional (orientativo)",
            data: values,
            tension: 0.3
          }]
        },
        options: {
          responsive: true,
          animation: false,
          scales: {
            y: {
              min: 0,
              max: 4,
              ticks: { stepSize: 1, callback: value => ["😢", "😟", "😶", "😐", "😊"][value] || "" }
            }
          }
        }
      });
    } else {
      chart.data.labels = labels;
      chart.data.datasets[0].data = values;
      chart.update("none");
    }
  } catch (error) {
    console.error("Error cargando panel familiar:", error);
    document.getElementById("statusBox").textContent = "No se pudieron actualizar los datos. Reintentando…";
  }
}

window.addEventListener("DOMContentLoaded", () => {
  loadData();
  setInterval(loadData, 10000);
});
</script>

</body>
</html>
