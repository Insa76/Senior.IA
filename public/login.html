<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ingreso</title>

  <style>
body {
  font-family: Arial;
  background: #f2f4f8;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  height: 100vh;
  padding: 20px;
  margin: 0;
}

.container {
  width: 100%;
  max-width: 400px;
}

h1 {
  text-align: center;
  font-size: 28px;
}

input {
  width: 100%;
  padding: 18px;
  font-size: 20px;
  margin: 10px 0;
  border-radius: 12px;
  border: 1px solid #ccc;
}

button {
  width: 100%;
  padding: 18px;
  font-size: 20px;
  border: none;
  border-radius: 12px;
  margin-top: 10px;
  cursor: pointer;
}

#enterBtn {
  background: #4a90e2;
  color: white;
}

#generateBtn {
  background: #6c757d;
  color: white;
}

#copyBtn {
  background: #28a745;
  color: white;
}

#generatedId, #familyLink {
  margin-top: 10px;
  font-size: 16px;
  word-break: break-word;
}
</style>
</head>

<body>

<div class="container">

<h1>Ingresar</h1>

<input id="userId" placeholder="Identificador de una cuenta existente" />

<button id="generateBtn" onclick="generateUser()">Generar identificador seguro</button>

<div id="generatedId"></div>
<div id="familyLink"></div>
<p style="font-size:13px;color:#555">La cuenta nueva genera un identificador aleatorio y un enlace familiar protegido. Compartí ese enlace solo con personas autorizadas. Si ingresás un identificador antiguo, el acceso familiar protegido no estará disponible.</p>

<button id="copyBtn" onclick="copyLink()">Copiar link familiar</button>

<button id="enterBtn" onclick="login()">Entrar</button>

</div>

<script>
let familyUrl = "";
let generatedAccount = null;

function normalizedUserId() {
  return document.getElementById("userId").value.trim();
}

function updateFamilyLink() {
  const userId = normalizedUserId();
  const token = generatedAccount && generatedAccount.userId === userId
    ? generatedAccount.familyToken
    : (localStorage.getItem("userId") === userId ? localStorage.getItem("familyToken") : "");
  familyUrl = token
    ? `${window.location.origin}/family.html?userId=${encodeURIComponent(userId)}#token=${encodeURIComponent(token)}`
    : "";
  document.getElementById("familyLink").textContent = familyUrl
    ? `Link familiar protegido: ${familyUrl}`
    : "Generá una cuenta nueva para crear un enlace familiar protegido.";
}

async function login() {
  const userId = normalizedUserId();
  if (!userId) return alert("Generá una cuenta nueva o ingresá un identificador existente.");
  if (userId.length > 80 || /[\/\\?#]/.test(userId)) return alert("El identificador no es válido.");

  const previousUserId = localStorage.getItem("userId");
  if (generatedAccount && generatedAccount.userId === userId) {
    localStorage.setItem("userId", userId);
    localStorage.setItem("familyToken", generatedAccount.familyToken);
  } else {
    localStorage.setItem("userId", userId);
    if (previousUserId !== userId) localStorage.removeItem("familyToken");
  }
  window.location.href = `/?userId=${encodeURIComponent(userId)}`;
}

async function generateUser() {
  const button = document.getElementById("generateBtn");
  button.disabled = true;
  button.textContent = "Creando cuenta…";
  try {
    const response = await fetch("/accounts", { method: "POST" });
    const data = await response.json();
    if (!response.ok) throw new Error(data.error || "No se pudo crear la cuenta.");
    generatedAccount = data;
    document.getElementById("userId").value = data.userId;
    document.getElementById("generatedId").textContent = "Identificador seguro creado. Guardalo: " + data.userId;
    updateFamilyLink();
  } catch (error) {
    alert(error.message);
  } finally {
    button.disabled = false;
    button.textContent = "Generar identificador seguro";
  }
}

async function copyLink() {
  updateFamilyLink();
  if (!familyUrl) return alert("Primero generá una cuenta nueva.");
  try {
    await navigator.clipboard.writeText(familyUrl);
    alert("Link familiar protegido copiado.");
  } catch (_) {
    window.prompt("Copiá este link y compartilo solo con el familiar autorizado:", familyUrl);
  }
}

document.getElementById("userId").addEventListener("input", updateFamilyLink);
updateFamilyLink();
</script>

</body>
</html>
